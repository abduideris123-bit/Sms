<style>
:root{
  --bg:#f1f4f2; --card:#ffffff; --ink:#15231f; --mute:#667a73; --line:#dde5e1;
  --head:#14382e; --headink:#f4f7f5; --gold:#f2c14e;
  --in:#1d7a4c; --in-bg:#e2f3ea; --out:#b3402e; --out-bg:#fbe9e5; --warn:#b97d0a; --warn-bg:#fcf1d6;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0e1815; --card:#16241f; --ink:#e8f0ec; --mute:#92a8a0; --line:#25382f;
  --head:#0a1f19; --in:#52c98a; --in-bg:#17382a; --out:#ef8672; --out-bg:#3b211c; --warn:#f2c14e; --warn-bg:#3a2f12}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Ethiopic','Abyssinica SIL',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:16px;line-height:1.5}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
header.top{background:var(--head);color:var(--headink);padding:calc(14px + env(safe-area-inset-top,0px)) 0 18px}
header.top .wrap{display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;font-weight:700}
header.top button{background:none;border:0;color:var(--headink);font-size:22px;padding:4px 8px;border-radius:8px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.sum .box{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px}
.sum small{display:block;opacity:.78;font-size:12.5px}
.sum b{font-size:20px;font-variant-numeric:tabular-nums}
.sum .net{grid-column:1/3;background:var(--gold);color:#2a2008}
.sum .net small{opacity:.8}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 13px;border-radius:99px;white-space:nowrap;font-size:14px}
.chip.on{background:var(--head);color:var(--headink);border-color:var(--head)}
.search{width:100%;margin-top:12px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card)}
.list{margin:6px 0 0;padding:0;list-style:none}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-top:8px;width:100%;text-align:left}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none}
.in .av{background:var(--in-bg);color:var(--in)} .out .av{background:var(--out-bg);color:var(--out)} .zero .av{background:var(--line);color:var(--mute)}
.row .mid{flex:1;min-width:0}
.row .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--mute)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.amt small{display:block;font-weight:400;font-size:12px;color:var(--mute)}
.in .amt{color:var(--in)} .out .amt{color:var(--out)}
.badge{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:99px;background:var(--warn-bg);color:var(--warn);margin-left:6px;vertical-align:middle}
.empty{text-align:center;color:var(--mute);padding:36px 10px}
nav.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom,0px))}
nav.bar .wrap{display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.bar button{background:none;border:0;padding:6px;color:var(--mute);font-size:12.5px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.bar button.on{color:var(--head)}
@media (prefers-color-scheme:dark){nav.bar button.on{color:var(--gold)}}
nav.bar .ic{font-size:21px;line-height:1}
.fab{width:56px;height:56px;border-radius:50%!important;background:var(--head)!important;color:var(--gold)!important;font-size:30px!important;margin:-26px auto 0;box-shadow:0 4px 14px rgba(0,0,0,.28);justify-content:center;flex-direction:row!important;gap:0!important}
/* person */
.phead{display:flex;align-items:center;gap:8px;margin:14px 0 4px}
.phead h2{margin:0;flex:1;font-size:21px}
.link{background:none;border:0;color:var(--mute);padding:6px 10px;border-radius:8px;font-size:14px}
.big{border-radius:var(--r);padding:16px;margin-top:8px}
.big.in{background:var(--in-bg);color:var(--in)} .big.out{background:var(--out-bg);color:var(--out)} .big.zero{background:var(--line);color:var(--mute)}
.big small{display:block}
.big b{font-size:28px;font-variant-numeric:tabular-nums}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:var(--card);padding:11px;border-radius:12px;font-weight:600}
.btn.p{background:var(--head);color:var(--headink);border-color:var(--head)}
.btn.d{color:var(--out)}
.tx{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-top:8px;width:100%;text-align:left;display:block}
.tx .l1{display:flex;justify-content:space-between;gap:10px;font-weight:600}
.tx .l2{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mute)}
.tx .plus{color:var(--in)} .tx .minus{color:var(--out)}
.tag{font-size:12px;padding:1px 8px;border-radius:99px;font-weight:600}
.tag.lend,.tag.repay_out{background:var(--in-bg);color:var(--in)} .tag.borrow,.tag.repay_in{background:var(--out-bg);color:var(--out)}
h3{font-size:15px;color:var(--mute);margin:20px 0 4px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:8px}
.card p{margin:4px 0 10px;color:var(--mute);font-size:14px}
.card input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);margin-bottom:8px}
.card .btn{width:100%;margin-top:4px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:94vh;overflow:auto}
.sheet h2{margin:0 0 10px;font-size:18px}
.types{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.types button{border:2px solid var(--line);background:var(--bg);padding:9px 6px;border-radius:12px;font-weight:600;font-size:14px;line-height:1.25}
.types button small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.types button.on.lend,.types button.on.repay_out{border-color:var(--in);background:var(--in-bg)}
.types button.on.borrow,.types button.on.repay_in{border-color:var(--out);background:var(--out-bg)}
.sheet label{display:block;font-size:13px;color:var(--mute);margin:10px 0 3px}
.sheet input,.sheet select,.sheet textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .total{font-size:20px;font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:99px;z-index:50;font-size:14px;max-width:90%}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.inst{background:var(--gold)!important;color:#2a2008!important;font-size:14px!important;font-weight:700;padding:7px 12px!important;border-radius:99px!important}
.rep table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;background:var(--card)}
.rep th,.rep td{border:1px solid var(--line);padding:6px 8px;text-align:left}
.rep td.n{text-align:right;font-variant-numeric:tabular-nums}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>

<script>
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => Number(n).toLocaleString('en-US', {maximumFractionDigits: 2});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const KEY = 'edha_v1', CFG = 'edha_cfg';

const SIGN = {lend: 1, repay_out: 1, borrow: -1, repay_in: -1};
const LABEL = {lend: 'ሰጠሁ', borrow: 'ወሰድኩ', repay_in: 'ተቀበልኩ', repay_out: 'ከፈልኩ'};
const HINT  = {lend: 'በዱቤ ሸጥኩ/አበደርኩ', borrow: 'በዱቤ ወሰድኩ/ተበደርኩ', repay_in: 'ክፍያ ተቀበልኩ', repay_out: 'ክፍያ ከፈልኩ'};

let db = {people: [], tx: [], trash: [], lastBackup: null, owner: null};
let cfg = {token: '', chat: ''};
try { db = Object.assign(db, JSON.parse(localStorage.getItem(KEY) || '{}')); } catch (e) {}
try { cfg = Object.assign(cfg, JSON.parse(localStorage.getItem(CFG) || '{}')); } catch (e) {}
const snap = () => JSON.stringify({people: db.people, tx: db.tx, trash: db.trash || []});
let prevState = snap(); const undoStack = [];
const save = () => { scheduleTg(); const s0 = snap(); if (s0 !== prevState) { undoStack.push(prevState); if (undoStack.length > 15) undoStack.shift(); prevState = s0; showUndoBar(); } try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { toast('ማስቀመጥ አልተቻለም — ማከማቻ ሞልቷል'); } };
const saveCfg = () => { try { localStorage.setItem(CFG, JSON.stringify(cfg)); } catch (e) {} };

let view = {name: 'home', pid: null, filter: 'all', q: '', range: '30'};

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2400);
}

/* ---------- calculations ---------- */
const person = id => db.people.find(p => p.id === id);
const txOf = pid => db.tx.filter(t => t.pid === pid).sort((a, b) => (a.date + a.id).localeCompare(b.date + b.id));
const balanceOf = pid => db.tx.reduce((s, t) => t.pid === pid ? s + SIGN[t.type] * t.amount : s, 0);
// overdue: a lend/borrow entry with a past due date while the person's debt in that direction is still open
function overdue(pid) {
  const b = balanceOf(pid); if (Math.abs(b) < 0.005) return false;
  const t0 = today();
  return db.tx.some(t => t.pid === pid && t.due && t.due < t0 && ((b > 0 && t.type === 'lend') || (b < 0 && t.type === 'borrow')));
}
function totals() {
  let inn = 0, out = 0;
  db.people.forEach(p => { const b = balanceOf(p.id); if (b > 0) inn += b; else out += -b; });
  return {inn, out, net: inn - out};
}
const balLabel = b => b > 0.005 ? 'ይከፍለኛል' : b < -0.005 ? 'እከፍለዋለሁ' : 'ተጠርጓል';
const cls = b => b > 0.005 ? 'in' : b < -0.005 ? 'out' : 'zero';

/* ---------- install ---------- */
let deferredInstall = null;
const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const installBtn = () => isStandalone() ? '' : '<button class="inst" data-act="install">⬇ Install</button>';
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; render(); toast('ተጭኗል ✓'); });
async function doInstall() {
  if (deferredInstall) { deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; render(); return; }
  showInstallHelp();
}
function showInstallHelp() {
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent);
  $('#sheet').innerHTML = `<div class="ov" id="ov"><div class="sheet"><h2>📲 ወደ Home Screen ጨምር</h2>
  <ol style="padding-left:20px;line-height:1.9">${ios
    ? '<li>በ <b>Safari</b> ክፈት</li><li>ከታች <b>Share</b> (⬆) ተጫን</li><li><b>Add to Home Screen</b> ምረጥ</li><li><b>Add</b> ተጫን</li>'
    : '<li>በ <b>Chrome</b> ክፈት</li><li>ከላይ በቀኝ <b>⋮</b> ተጫን</li><li><b>Add to Home screen</b> ወይም <b>Install app</b> ምረጥ</li><li><b>Install</b> ተጫን</li>'}</ol>
  <button class="btn p" style="width:100%" id="fc">እሺ</button></div></div>`;
  $('#fc').onclick = closeSheet; $('#ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
}
function installBanner() {
  if (isStandalone() || cfg.noInstall) return '';
  return `<div class="card" style="background:var(--head);color:var(--headink)"><b>📲 ወደ Home Screen ጨምር</b><p style="color:inherit;opacity:.85">እንደ መተግበሪያ ከስልክህ ገጽ በቀጥታ ክፈተው።</p><div class="acts"><button class="btn" style="background:var(--gold);color:#2a2008;border-color:var(--gold)" data-act="install">ጨምር</button><button class="btn" style="background:none;color:inherit" data-act="noinst">አሁን አይደለም</button></div></div>`;
}

/* ---------- render ---------- */
function render() {
  const app = $('#app');
  if (view.name === 'person' && !person(view.pid)) view = {...view, name: 'home'};
  app.innerHTML = ({home: homeHTML, person: personHTML, report: reportHTML, items: itemsHTML, trash: trashHTML, settings: settingsHTML}[view.name] || homeHTML)();
  const q = $('#q'); if (q && document.activeElement !== q && view._focusQ) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const pq = $('#pq'); if (pq && document.activeElement !== pq && view._focusP) { pq.focus(); pq.setSelectionRange(pq.value.length, pq.value.length); }
  const iq = $('#iq'); if (iq && document.activeElement !== iq && view._focusI) { iq.focus(); iq.setSelectionRange(iq.value.length, iq.value.length); }
  view._focusQ = false; view._focusP = false; view._focusI = false;
}

function navHTML() {

function homeHTML() {

  if (f === 'in') ppl = ppl.filter(x => x.b > 0.005);
  if (f === 'out') ppl = ppl.filter(x => x.b < -0.005);

  if (q) ppl = ppl.filter(x => (x.p.name + ' ' + (x.p.phone || '')).toLowerCase().includes(q));

function openTx(opts = {}) {
  const t = opts.id ? db.tx.find(x => x.id === opts.id) : null;
  const cur = t || {type: opts.type || 'lend', pid: opts.pid || (db.people[0] && db.people[0].id) || '__new', date: today(), item: '', qty: '', price: '', amount: '', method: opts.method || '', due: '', note: ''};
  const isDebt = ty => ty === 'lend' || ty === 'borrow';
  const ty = (k) => `<button type="button" class="${k} ${cur.type === k ? 'on' : ''}" data-ty="${k}">${LABEL[k]}<small>${HINT[k]}</small></button>`;
  $('#sheet').innerHTML = `<div class="ov" id="ov"><form class="sheet" id="f" autocomplete="off">
    <h2>${t ? 'ግብይት አርትዕ' : 'አዲስ ግብይት'}</h2>
    <div class="types">${ty('lend')}${ty('borrow')}${ty('repay_in')}${ty('repay_out')}</div>
    <button type="button" class="link" id="fsmsb" style="padding-left:0">📋 የባንክ መልእክት ለጥፍ</button>
    <div id="smsw" class="hidden"><textarea id="fsms" rows="3" placeholder="የ cbe / abisinya / telebirr መልእክት እዚህ ይለጥፉ"></textarea><div id="smsr" class="sub" style="margin-top:4px"></div></div>
    <label>ሰው</label>
    <select id="fp">${db.people.map(p => `<option value="${p.id}" ${p.id === cur.pid ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}<option value="__new" ${cur.pid === '__new' ? 'selected' : ''}>+ አዲስ ሰው</option></select>
    <div id="newp" class="g2 ${cur.pid === '__new' ? '' : 'hidden'}"><div><label>ስም</label><input id="fn" placeholder="ስም"></div><div><label>ስልክ (አማራጭ)</label><input id="fph" type="tel" inputmode="tel"></div></div>
    <div class="g2"><div><label>ቀን</label><input id="fd" type="date" value="${esc(cur.date)}" required></div>
      <div id="dueb"><label>ቀነ ገደብ (አማራጭ)</label><input id="fdue" type="date" value="${esc(cur.due || '')}"></div>
      <div id="methb"><label>የክፍያ መንገድ</label><input id="fm" list="meths" placeholder="cbe, cash…" value="${esc(cur.method || '')}"><datalist id="meths"><option>cash</option><option>cbe</option><option>abisinya</option><option>telebirr</option><option>awash</option></datalist></div></div>
    <div id="itemb"><label>ዕቃ / ምክንያት</label><input id="fi" list="items" value="${esc(cur.item || '')}" placeholder="ለምሳሌ ማዳበሪያ"><datalist id="items">${Object.values(itemInfo()).sort((a, b) => b.n - a.n).slice(0, 300).map(e => `<option value="${esc(e.name)}">`).join('')}</datalist></div>
    <div id="ctnb" class="g2"><div><label>📦 ስንት ካርቶን</label><input id="fct" type="number" inputmode="decimal" step="any" min="0" value="${cur.ctn || ''}"></div><div><label>በአንድ ካርቶን ስንት</label><input id="fpc" type="number" inputmode="decimal" step="any" min="0" value="${cur.per || ''}"></div></div>
    <div class="g2" id="qpb"><div><label>ብዛት</label><input id="fq" type="number" inputmode="decimal" step="any" min="0" value="${cur.qty || ''}"></div>
      <div><label>የአንዱ ዋጋ</label><input id="fpr" type="number" inputmode="decimal" step="any" min="0" value="${cur.price || ''}"></div></div>
    <div id="phint" class="sub" style="margin-top:4px"></div>
    <button type="button" class="link hidden" id="fullb" style="padding-left:0"></button>
    <label>ጠቅላላ መጠን (ብር)</label><input id="fa" class="total" type="number" inputmode="decimal" step="any" min="0" value="${cur.amount || ''}" required>
    <label>ማስታወሻ (አማራጭ)</label><input id="fno" value="${esc(cur.note || '')}">
    <label>📷 የደረሰኝ ፎቶ (አማራጭ)</label><input id="fimgf" type="file" accept="image/*"><div id="fimgp" style="margin-top:6px"></div>
    <div class="acts" style="margin-top:16px"><button type="button" class="btn" id="fc">ዝጋ</button><button class="btn p">አስቀምጥ</button></div>
    ${t ? '<button type="button" class="btn d" id="fdel" style="width:100%;margin-top:8px">ሰርዝ</button>' : ''}
  </form></div>`;
  let type = cur.type;
  const sync = () => {
    const d = isDebt(type);
    $('#qpb').classList.toggle('hidden', !d); $('#ctnb').classList.toggle('hidden', !d); $('#itemb').classList.toggle('hidden', !d);
    $('#dueb').classList.toggle('hidden', !d); $('#methb').classList.toggle('hidden', d);
    document.querySelectorAll('.types button').forEach(b => b.classList.toggle('on', b.dataset.ty === type));
    const pid0 = $('#fp').value, bal0 = pid0 !== '__new' ? balanceOf(pid0) : 0;
    $('#fullb').classList.toggle('hidden', d || Math.abs(bal0) < 0.005); $('#fullb').textContent = `ሙሉ ቀሪውን ሙላ (${fmt(Math.abs(bal0))})`;
  };
  sync();

/* ---------- monthly chart ---------- */
function monthChart() {
  const now = new Date(), ms = [];
  for (let i = 5; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); ms.push(d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0')); }
  const data = ms.map(m => { const o = {borrow: 0, repay_out: 0, lend: 0, repay_in: 0}; db.tx.forEach(t => { if (t.date.slice(0, 7) === m) o[t.type] += t.amount; }); return o; });
  const keys = ['borrow', 'repay_out', 'lend', 'repay_in'], col = {borrow: '#b3402e', repay_out: '#1d7a4c', lend: '#c28a1b', repay_in: '#2a6fb0'};
  const use = keys.filter(k => data.some(o => o[k] > 0)); if (!use.length) return '';
  const max = Math.max(...data.flatMap(o => use.map(k => o[k]))), W = 360, H = 170, gw = W / 6, bw = Math.min(16, (gw - 10) / use.length);
  const bars = data.map((o, i) => use.map((k, j) => { const hh = Math.max(1, o[k] / max * (H - 44)), x = i * gw + (gw - bw * use.length) / 2 + j * bw; return o[k] > 0 ? `<rect x="${x.toFixed(1)}" y="${(H - 22 - hh).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="${col[k]}"/>` : ''; }).join('') + `<text x="${(i * gw + gw / 2).toFixed(1)}" y="${H - 6}" font-size="11" text-anchor="middle" fill="currentColor">${ms[i].slice(2)}</text>`).join('');
  const legend = use.map(k => `<span style="margin-right:10px;white-space:nowrap"><span style="display:inline-block;width:10px;height:10px;background:${col[k]};border-radius:2px"></span> ${LABEL[k]}</span>`).join('');
  return `<div style="margin:8px 0"><div style="font-size:13px;margin-bottom:4px">የመጨረሻ 6 ወር (yy-mm) · ከፍተኛ ${fmt(max)}</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="max-width:520px"><line x1="0" y1="${H - 22}" x2="${W}" y2="${H - 22}" stroke="currentColor" opacity=".3"/>${bars}</svg><div style="font-size:13px">${legend}</div></div>`;
}

/* ---------- bank SMS parser ---------- */
function parseBankSMS(s) {
  const t = String(s || ''), low = t.toLowerCase(), out = {};
  const re = /\b(?:ETB|Birr)\b\s*(\d[\d,]*(?:\.\d+)?)|ብር\s*(\d[\d,]*(?:\.\d+)?)|(\d[\d,]*(?:\.\d+)?)\s*(?:\b(?:ETB|Birr)\b|ብር)/gi; let m;
  while ((m = re.exec(t))) {
    if (/balance|ቀሪ|charge|fee|vat|commission/i.test(t.slice(Math.max(0, m.index - 35), m.index))) continue;
    const v = parseFloat((m[1] || m[2] || m[3]).replace(/,/g, '')); if (v > 0) { out.amount = v; break; }
  }
  let d = t.match(/(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/), y, mo, da;
  if (d) { y = +d[1]; mo = +d[2]; da = +d[3]; } else if ((d = t.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})/))) { da = +d[1]; mo = +d[2]; y = +d[3]; if (mo > 12 && da <= 12) [da, mo] = [mo, da]; }
  if (y >= 2000 && y < 2100 && mo >= 1 && mo <= 12 && da >= 1 && da <= 31) out.date = `${y}-${String(mo).padStart(2, '0')}-${String(da).padStart(2, '0')}`;
  const banks = [[/telebirr|tele birr|ቴሌብር/, 'telebirr'], [/abyssinia|abisinya|\bboa\b/, 'abisinya'], [/commercial bank|\bcbe\b|cbebirr|cbe birr/, 'cbe'], [/awash/, 'awash'], [/oromia|\bcbo\b/, 'cbo'], [/dashen/, 'dashen'], [/zemen/, 'zemen']];
  for (const [r, n] of banks) if (r.test(low)) { out.bank = n; break; }
  const o = low.search(/debited|transferred|transfered|\bsent\b|\bpaid\b|withdr|ተልኳል|ተላልፏል|ከፍለዋል/), i = low.search(/credited|received|deposit|ደርሶታል|ገቢ/);
  if (o >= 0 && (i < 0 || o < i)) out.dir = 'repay_out'; else if (i >= 0) out.dir = 'repay_in';
  const rf = t.match(/\b(?:ref(?:erence)?(?:\s*(?:no|number|#))?|transaction\s*(?:number|id|no)|receipt\s*no)\b[:.\s#-]*([A-Z0-9]{6,})/i) || t.match(/\b(FT[A-Z0-9]{8,})\b/);
  if (rf) out.ref = rf[1];
  return out;
}

/* ---------- receipt photos (IndexedDB) ---------- */
const idb = () => new Promise((res, rej) => { const r = indexedDB.open('edha_img', 1); r.onupgradeneeded = () => r.result.createObjectStore('i'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
const imgPut = async (k, v) => { const d = await idb(); return new Promise((res, rej) => { const x = d.transaction('i', 'readwrite'); x.objectStore('i').put(v, k); x.oncomplete = res; x.onerror = () => rej(x.error); }); };
const imgGet = async k => { try { const d = await idb(); return await new Promise(res => { const r = d.transaction('i').objectStore('i').get(k); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); } catch (e) { return null; } };
const imgDel = async k => { const d = await idb(); return new Promise(res => { const x = d.transaction('i', 'readwrite'); x.objectStore('i').delete(k); x.oncomplete = res; x.onerror = res; }); };
const compressImg = file => new Promise((res, rej) => {
  const fr = new FileReader();
  fr.onload = () => { const im = new Image(); im.onload = () => { const s = Math.min(1, 900 / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * s); c.height = Math.round(im.height * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', 0.65)); }; im.onerror = rej; im.src = fr.result; };
  fr.onerror = rej; fr.readAsDataURL(file);
});
function viewImg(src) {
  const d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;padding:10px';

const sha = async s => { try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); } catch (e) { let h = 5381; for (const c of s) h = (h * 33 + c.charCodeAt(0)) >>> 0; return 'x' + h; } };

/* biometric unlock (fingerprint / face) via WebAuthn — the PIN stays as fallback */
const b64 = u => btoa(String.fromCharCode(...new Uint8Array(u))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function enableBio() {

    const cred = await navigator.credentials.create({publicKey: {
      challenge: crypto.getRandomValues(new Uint8Array(32)), rp: {name: 'የእዳ መዝገብ'},
      user: {id: crypto.getRandomValues(new Uint8Array(16)), name: 'owner', displayName: ownerText() || 'Owner'},
      pubKeyCredParams: [{type: 'public-key', alg: -7}, {type: 'public-key', alg: -257}],
      authenticatorSelection: {authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged'}, timeout: 60000, attestation: 'none'}});
    cfg.bio = true; cfg.bioId = b64(cred.rawId); saveCfg(); render(); toast('👆 አሻራ/ፊት ክፈት በርቷል ✓');
  } catch (e) { toast('አልተሳካም — ' + (e && e.name === 'NotAllowedError' ? 'ተሰርዟል' : 'ስልክዎ አይደግፍም')); }
}

}

  const p = person(id); let run = 0;
  const rows = txOf(id).map(t => { run += SIGN[t.type] * t.amount; return `<tr><td>${esc(t.date)}</td><td>${esc(t.item || t.method || '')}${t.ctn ? ' · 📦 ' + fmt(t.ctn) + ' ካርቶን' : ''}</td><td>${LABEL[t.type]}</td><td class="n">${SIGN[t.type] > 0 ? '+' : '−'}${fmt(t.amount)}</td><td class="n">${fmt(run)}</td></tr>`; }).join('');
  printDoc('መግለጫ', `<h1>የ${esc(p.name)} ሂሳብ መግለጫ</h1><table><tr><th>ቀን</th><th>ዕቃ / መንገድ</th><th>አይነት</th><th>መጠን</th><th>ቀሪ</th></tr>${rows}</table><h3>${balLabel(run)}፡ ${fmt(Math.abs(run))} ብር</h3>`);
}

/* ---------- send person ledger (CSV) to Telegram ---------- */
async function sendPersonCSV(id) {
  const p = person(id); let run = 0;
  const rows = [['ቀን', 'ዕቃ / መንገድ', 'አይነት', 'ካርቶን', 'ብዛት', 'የአንዱ ዋጋ', 'መጠን (+/−)', 'ቀሪ', 'ቀነ ገደብ', 'ማስታወሻ']];
  txOf(id).forEach(t => { run += SIGN[t.type] * t.amount; rows.push([t.date, t.item || t.method || '', LABEL[t.type], t.ctn || '', t.qty || '', t.price || '', SIGN[t.type] * t.amount, run, t.due || '', t.note || '']); });
  rows.push(['', '', '', '', '', '', balLabel(run), run, '', '']);
  if (db.owner && db.owner.name) rows.push([], ['መዝገብ ባለቤት', db.owner.name, db.owner.phone || '']);
  const stamp = `${p.name.replace(/[^\w\u1200-\u137F-]+/g, '_')}-${today()}-${new Date().toTimeString().slice(0, 5).replace(':', '')}`;
  const blob = new Blob(['\ufeff' + rows.map(r => r.map(c => typeof c === 'number' ? String(c) : `"${String(c ?? '').replace(/"/g, '""')}"`).join(',')).join('\n')], {type: 'text/csv;charset=utf-8'});
  const fname = stamp + '.csv';
  if (cfg.token && cfg.chat) {
    toast('ወደ Telegram እየላከ ነው…');
    try {
      const fd = new FormData(); fd.append('chat_id', cfg.chat); fd.append('caption', `${p.name} — ${balLabel(run)}፡ ${fmt(Math.abs(run))} ብር${ownerText() ? '\n👤 ' + ownerText() : ''}`); fd.append('document', blob, fname);
      const j = await (await fetch(`https://api.telegram.org/bot${cfg.token}/sendDocument`, {method: 'POST', body: fd})).json();
      return toast(j.ok ? 'CSV' + ' ወደ Telegram ተልኳል ✓' : 'አልተላከም: ' + (j.description || 'Token/Chat ID ያረጋግጡ'));
    } catch (e) { toast('ኢንተርኔት የለም — ፋይሉ ይወርዳል'); }
  }
  const file = new File([blob], fname, {type: blob.type});
  try { if (navigator.canShare && navigator.canShare({files: [file]})) { await navigator.share({files: [file]}); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  download(fname, blob, blob.type);
  if (!cfg.token) toast('Telegram አልተቀናበረም — ፋይሉ ወርዷል (ቅንብር ውስጥ አስገባ)');
}

/* ---------- auto Telegram backup ---------- */
let tgTimer = null;
function scheduleTg() {
  if (!cfg.auto || !cfg.token || !cfg.chat) return;
  clearTimeout(tgTimer);
  tgTimer = setTimeout(async () => {
    try {
      const fd = new FormData(); fd.append('chat_id', cfg.chat); fd.append('document', await backupBlob(false), `edha-backup-${today()}.json`);
      const j = await (await fetch(`https://api.telegram.org/bot${cfg.token}/sendDocument`, {method: 'POST', body: fd})).json();
      if (j.ok) { db.lastBackup = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} toast('Telegram ምትኬ ✓'); }
    } catch (e) {}
  }, 8000);
}

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'go') { view = {...view, name: el.dataset.v, _focusQ: false}; render(); window.scrollTo(0, 0); }
  else if (a === 'open') { view = {...view, name: 'person', pid: id, pq: ''}; render(); window.scrollTo(0, 0); }
  else if (a === 'filter') { view.filter = el.dataset.k; view._focusQ = false; render(); }
  else if (a === 'install') doInstall();
  else if (a === 'new') openTx({pid: el.dataset.pid});
  else if (a === 'edit') openTx({id});
  else if (a === 'editp') editPerson(id);
  else if (a === 'delp') {
    const p = person(id);
    if (confirm(`"${p.name}" እና ሁሉም ግብይቶቹ ይሰረዙ? ወደ ታሪክ ይወሰዳል፤ ከዚያ መመለስ ይቻላል።`)) { toTrash({kind: 'person', person: p, txs: db.tx.filter(t => t.pid === id)}); db.people = db.people.filter(x => x.id !== id); db.tx = db.tx.filter(t => t.pid !== id); save(); view = {...view, name: 'home'}; render(); }
  }
  else if (a === 'noinst') { cfg.noInstall = true; saveCfg(); render(); }
  else if (a === 'pcsv') sendPersonCSV(id);
  else if (a === 'item') openItem(el.dataset.k);
  else if (a === 'undo') doUndo();
  else if (a === 'owner') openOwner();
  else if (a === 'quickpay') quickPay(id);
  else if (a === 'repeat') openRepeat(id);
  else if (a === 'bioon') enableBio();
  else if (a === 'biooff') { delete cfg.bio; delete cfg.bioId; saveCfg(); render(); toast('አሻራ ጠፍቷል'); }
  else if (a === 'pinset') pinAction('set');
  else if (a === 'pinchg') pinAction('chg');
  else if (a === 'pinoff') pinAction('off');
  else if (a === 'range') { view.range = el.dataset.k; render(); }
  else if (a === 'pdfr') printDoc('ሪፖርት', '<h1>የእዳ መዝገብ — ሪፖርት</h1>' + reportBody(reportData()));
  else if (a === 'pdfp') personPDF(id);
  else if (a === 'trestore') restoreTrash(id);
  else if (a === 'tperm') { if (confirm('ለዘለዓለም ይሰረዝ?')) { db.trash = db.trash.filter(e => e.id !== id); save(); render(); } }
  else if (a === 'tempty') { if (confirm('ታሪኩ ሁሉ ለዘለዓለም ይሰረዝ?')) { db.trash = []; save(); render(); } }
  else if (a === 'notif') { if (!('Notification' in window)) return toast('ይህ browser አይደግፍም'); Notification.requestPermission().then(() => { render(); notifyDue(); }); }
  else if (a === 'tgtest') {
    cfg.token = $('#tgt').value.trim(); cfg.chat = $('#tgc').value.trim(); saveCfg();
    try { const r = await fetch(`https://api.telegram.org/bot${cfg.token}/sendMessage`, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({chat_id: cfg.chat, text: '✅ የእዳ መዝገብ ከ Telegram ጋር ተገናኝቷል'})}); toast((await r.json()).ok ? 'የሙከራ መልእክት ተልኳል ✓' : 'አልተሳካም — Token/Chat ID ያረጋግጡ'); } catch (err) { toast('ኢንተርኔት የለም'); }
  }
  else if (a === 'export') { download(`edha-backup-${today()}.json`, await (await backupBlob(true)).text(), 'application/json'); db.lastBackup = Date.now(); save(); render(); }
  else if (a === 'csv') download(`edha-${today()}.csv`, csv(), 'text/csv;charset=utf-8');
  else if (a === 'import') $('#file').click();
  else if (a === 'tgsave') { cfg.token = $('#tgt').value.trim(); cfg.chat = $('#tgc').value.trim(); saveCfg(); toast('ተቀምጧል'); }
  else if (a === 'tgsend') {
    cfg.token = $('#tgt').value.trim(); cfg.chat = $('#tgc').value.trim(); saveCfg();
    if (!cfg.token || !cfg.chat) return toast('Token እና Chat ID ያስገቡ');
    try {
      const fd = new FormData(); fd.append('chat_id', cfg.chat);
      fd.append('document', await backupBlob(true), `edha-backup-${today()}.json`);
      const r = await fetch(`https://api.telegram.org/bot${cfg.token}/sendDocument`, {method: 'POST', body: fd});
      const j = await r.json();
      if (j.ok) { db.lastBackup = Date.now(); save(); render(); toast('ወደ Telegram ተልኳል ✓'); } else toast('አልተላከም: ' + (j.description || 'ስህተት'));
    } catch (err) { toast('ኢንተርኔት የለም ወይም ስህተት'); }
  }
  else if (a === 'wipe') {
    if (confirm('ሁሉም መረጃ ይሰረዝ? ምትኬ ካላወረዱ መመለስ አይቻልም።') && confirm('በእርግጥ?')) { db = {people: [], tx: [], lastBackup: null}; save(); view = {name: 'home', pid: null, filter: 'all', q: ''}; render(); }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { view.q = e.target.value; view._focusQ = true; render(); }
  else if (e.target.id === 'pq') { view.pq = e.target.value; view._focusP = true; render(); }
  else if (e.target.id === 'iq') { view.iq = e.target.value; view._focusI = true; render(); }
});
document.addEventListener('change', e => {
  if (e.target.id === 'tga') { cfg.auto = e.target.checked; saveCfg(); toast(cfg.auto ? 'በራስ-ሰር ምትኬ በርቷል' : 'በራስ-ሰር ምትኬ ጠፍቷል'); return; }
  if (e.target.id !== 'file') return;
  const f = e.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = async () => {
    try {
      const j = JSON.parse(rd.result);
      if (!Array.isArray(j.people) || !Array.isArray(j.tx)) throw 0;
      if (j.owner && j.owner.name && db.owner && db.owner.name && (digits(j.owner.phone) !== digits(db.owner.phone) || (j.owner.name || '').trim().toLowerCase() !== db.owner.name.trim().toLowerCase()) && !confirm(`⚠ ይህ ምትኬ የ"${j.owner.name} ${j.owner.phone || ''}" ነው፤ የእርስዎ ("${db.owner.name} ${db.owner.phone || ''}") አይደለም።\n\nቢሆንም ይቀጥል?`)) return;
      const info = `${j.people.length} ሰዎች እና ${j.tx.length} ግብይቶች`;
      if (confirm(`${info} ከአሁኑ መረጃ ጋር ይጨመሩ?\n\nOK = ጨምር (አሁን ያለው አይሰረዝም)\nCancel = ሌላ ምርጫ`)) {
        const pid = new Set(db.people.map(p => p.id)), tid = new Set(db.tx.map(t => t.id));
        db.people.push(...j.people.filter(p => !pid.has(p.id)));
        db.tx.push(...j.tx.filter(t => !tid.has(t.id)));
      } else if (confirm(`በምትኩ አሁን ያለው መረጃ በሙሉ በ${info} ይተካ?`)) {
        db.people = j.people; db.tx = j.tx; db.trash = j.trash || [];
      } else return;
      if (j.owner && j.owner.name && !(db.owner && db.owner.name)) db.owner = j.owner;
      if (j.images) for (const [k, v] of Object.entries(j.images)) { try { await imgPut(k, v); } catch (err) {} }
      save(); view = {...view, name: 'home'}; render(); toast('ተመልሷል ✓');
    } catch (err) { toast('ፋይሉ ትክክል አይደለም'); }
  };
  rd.readAsText(f); e.target.value = '';
});

render();
if (cfg.pinHash) showLock(); else notifyDue();

/* ---------- offline (service worker) ---------- */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  navigator.serviceWorker.register('sw.js').then(reg => {
    setInterval(() => reg.update().catch(() => {}), 30 * 60 * 1000);
  }).catch(() => {});
}
window.addEventListener('offline', () => toast('📴 ኢንተርኔት የለም — መረጃ በስልክህ ይቀመጣል'));
window.addEventListener('online', () => toast('✅ ኢንተርኔት ተመልሷል'));
</script>
</body>
</html>
